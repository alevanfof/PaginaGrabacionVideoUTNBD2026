<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFI · Bases de Datos I · Exposición</title>
<meta name="description" content="Bloques de exposición del TFI de Bases de Datos I: sistema, carga masiva, seguridad, transacciones y concurrencia.">
<style>
/* ============================================================
   TFI · Bases de Datos I · deck de exposición para grabar
   Escenario fijo 1280×720, escalado al viewport.
   ============================================================ */
:root{
  --ink:#111428; --muted:#5c6382; --line:#e3e7f2; --soft:#f5f7fc;
  --accent:#4f46e5; --accent-soft:#eef0ff;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#080a12;font-family:var(--sans);color:var(--ink)}
button{font-family:inherit}

#stage{
  position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform-origin:center;transform:translate(-50%,-50%) scale(1);
  background:linear-gradient(180deg,#ffffff 0%,#f8f9fe 100%);
  overflow:hidden;user-select:none;box-shadow:0 40px 120px rgba(0,0,0,.55);
}

/* ---------- selector de alumno ---------- */
#inicio{
  position:absolute;inset:0;z-index:10;display:flex;align-items:center;
  padding:0 76px;background:
    radial-gradient(1100px 520px at 12% -10%,rgba(79,70,229,.10),transparent 60%),
    radial-gradient(900px 480px at 108% 118%,rgba(13,148,136,.10),transparent 60%),
    linear-gradient(180deg,#ffffff,#f6f7fc);
  transition:opacity .4s ease;
}
#inicio.oculto{opacity:0;pointer-events:none}
.inicio-inner{width:100%}
.eyebrow{
  font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#8a90aa;
}
.inicio-titulo{
  font-size:46px;line-height:1.08;letter-spacing:-.025em;font-weight:700;
  margin:14px 0 0;max-width:22ch;
}
.inicio-sub{font-size:16px;color:var(--muted);margin:14px 0 0}
.personas{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}
.persona{
  position:relative;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:22px 22px 20px;cursor:pointer;overflow:hidden;
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
  box-shadow:0 2px 10px rgba(17,20,40,.04);
}
.persona:hover,.persona:focus-visible{
  transform:translateY(-4px);box-shadow:0 18px 40px rgba(17,20,40,.12);
  border-color:color-mix(in srgb,var(--accent) 45%,#fff);outline:none;
}
.persona-barra{position:absolute;left:0;top:0;height:4px;width:100%;background:var(--accent)}
.persona-nombre{font-size:18.5px;font-weight:700;letter-spacing:-.01em;margin-top:4px}
.persona-grupo{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-top:6px}
.persona-bloque{font-size:13px;line-height:1.45;color:var(--muted);margin-top:14px;min-height:38px}
.persona-dur{font-size:11.5px;color:#9aa0b8;margin-top:14px;font-variant-numeric:tabular-nums}
.inicio-pie{font-size:12px;color:#9aa0b8;margin-top:26px}

.p-alejandro{--accent:#4f46e5}
.p-gabriel{--accent:#0f766e}
.p-josue{--accent:#b45309}

/* ---------- deck ---------- */
#deck{position:absolute;inset:0;z-index:1;overflow:hidden}
#deck.al-alejandro{--accent:#4f46e5;--accent-soft:#eef0ff}
#deck.al-gabriel{--accent:#0f766e;--accent-soft:#e7f6f2}
#deck.al-josue{--accent:#b45309;--accent-soft:#fdf1e2}
#deck::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle at 1px 1px,rgba(17,20,40,.06) 1px,transparent 0);
  background-size:26px 26px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,transparent 34%,#000 78%);
          mask-image:linear-gradient(90deg,transparent 0%,transparent 34%,#000 78%);
  opacity:.7;
}
.slide{
  position:absolute;inset:0;opacity:0;pointer-events:none;
  transition:opacity .55s ease,transform .55s ease;transform:translateY(8px);
}
.slide.active{opacity:1;pointer-events:auto;transform:none}

.topbar{
  position:absolute;top:30px;left:54px;right:54px;display:flex;
  justify-content:space-between;align-items:center;gap:24px;
  font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#9aa0b8;
}
.topbar span:last-child{color:var(--accent);opacity:.85}

/* ---------- portada del bloque ---------- */
.cover-grid{
  position:absolute;inset:0;display:grid;grid-template-columns:1fr 372px;
  gap:48px;align-items:center;padding:0 64px;
}
.cover-main{position:relative}
.cover-main .eyebrow{color:var(--accent)}
.cover-main h1{
  font-size:58px;line-height:1.02;letter-spacing:-.035em;font-weight:700;margin:18px 0 0;
}
.cover-bloque{
  font-size:17px;line-height:1.45;color:var(--muted);margin-top:18px;max-width:30ch;
}
.cover-pie{
  font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:#9aa0b8;margin-top:34px;
}
.agenda{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 24px 18px;
  box-shadow:0 22px 55px rgba(17,20,40,.09);
}
.agenda-titulo{
  font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:#9aa0b8;margin-bottom:14px;
}
.agenda-item{
  display:flex;gap:14px;align-items:baseline;padding:13px 0;
  border-top:1px solid var(--line);font-size:14px;line-height:1.35;color:#2a2f4a;
}
.agenda-num{
  font-size:11px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;
  letter-spacing:.06em;
}

/* ---------- escena ---------- */
.scene-grid{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:18px;
  padding:78px 44px 40px;
}
.scene-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:36px;
  flex:0 0 auto;
}
.scene-head .izq{min-width:0}
.kicker{
  display:inline-flex;align-items:center;gap:9px;font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
}
.kicker::before{content:"";width:20px;height:2px;border-radius:2px;background:var(--accent)}
.scene-head h1{
  font-size:34px;line-height:1.08;letter-spacing:-.026em;font-weight:700;margin:12px 0 0;
  white-space:nowrap;
}
.scene-lado{flex:0 0 auto;text-align:right;max-width:400px;padding-bottom:3px}
.sub{font-size:14px;line-height:1.45;color:var(--muted);margin:0}
.scene-index{
  margin-top:9px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.scene-index span{color:#c3c8da;font-weight:600}

.shot{
  margin:0;background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 24px 60px rgba(17,20,40,.13);display:flex;flex-direction:column;
  overflow:hidden;flex:1 1 auto;min-height:0;
}
.shot-head{
  height:34px;flex:0 0 34px;display:flex;align-items:center;gap:6px;padding:0 14px;
  border-bottom:1px solid var(--line);background:#fafbff;
}
.dot{width:7px;height:7px;border-radius:50%;background:#e0e4f0}
.shot-tag{
  margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:#b3b8cc;
}
.shot-body{
  position:relative;flex:1 1 auto;min-height:0;padding:12px;
  background:#eef1f9;
  box-shadow:inset 0 1px 3px rgba(17,20,40,.05);
}
.shot-body img{
  position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);
  object-fit:contain;background:#fff;border-radius:6px;
  box-shadow:0 1px 4px rgba(17,20,40,.10);
  opacity:0;transition:opacity .42s ease;
}
.shot-body img.on{opacity:1}
.shot-foot{
  flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:18px;
  padding:10px 16px;border-top:1px solid var(--line);background:#fff;
}
.cap{font-size:11.5px;line-height:1.35;color:#5c6382;font-style:italic}
.counter{
  font-size:10px;font-weight:700;letter-spacing:.1em;color:#b3b8cc;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}

/* ---------- fin ---------- */
.fin{display:flex;align-items:center;justify-content:center;text-align:center}
.fin-inner{padding-bottom:10px}
.fin-linea{width:54px;height:3px;border-radius:3px;background:var(--accent);margin:0 auto 26px}
.fin-titulo{font-size:44px;font-weight:700;letter-spacing:-.03em}
.fin-nombre{font-size:18px;color:#2a2f4a;margin-top:14px}
.fin-grupo{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#9aa0b8;margin-top:8px}
.fin-volver{
  margin-top:34px;background:transparent;border:1px solid var(--line);border-radius:999px;
  padding:9px 20px;font-size:12px;color:#8a90aa;cursor:pointer;
  opacity:0;transition:opacity .5s ease .9s,color .2s ease,border-color .2s ease;
}
.fin.active .fin-volver{opacity:1}
.fin-volver:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,#fff)}

/* ---------- animaciones de entrada ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.slide.active .kicker{animation:rise .5s .04s both}
.slide.active .scene-head h1{animation:rise .55s .10s both}
.slide.active .sub{animation:rise .55s .18s both}
.slide.active .shot{animation:pop .6s .08s both}
.slide.active .cover-main .eyebrow{animation:rise .5s .04s both}
.slide.active .cover-main h1{animation:rise .6s .10s both}
.slide.active .cover-bloque{animation:rise .6s .18s both}
.slide.active .cover-pie{animation:rise .6s .26s both}
.slide.active .agenda{animation:pop .65s .16s both}
.slide.active .agenda-item{animation:rise .45s both}
.slide.active .agenda-item:nth-child(2){animation-delay:.24s}
.slide.active .agenda-item:nth-child(3){animation-delay:.31s}
.slide.active .agenda-item:nth-child(4){animation-delay:.38s}

/* ---------- ruedita de ajustes ---------- */
#engranaje{
  position:fixed;right:14px;bottom:14px;width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;z-index:60;
  color:rgba(255,255,255,.16);transition:color .25s ease,transform .35s ease;
}
#engranaje svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
#engranaje:hover{color:rgba(255,255,255,.7);transform:rotate(35deg)}

#panel{
  position:fixed;right:14px;bottom:52px;width:268px;z-index:60;
  background:rgba(16,19,34,.97);border:1px solid rgba(255,255,255,.12);
  border-radius:14px;padding:16px 16px 14px;color:#e8eaf4;
  box-shadow:0 22px 60px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transform:translateY(8px);
  transition:opacity .22s ease,transform .22s ease;
}
#panel.abierto{opacity:1;pointer-events:auto;transform:none}
.panel-titulo{
  font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:#8b93b5;margin-bottom:14px;
}
.ajuste{display:block;margin-bottom:14px}
.ajuste span{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:12px;color:#c8cde0;margin-bottom:7px;
}
.ajuste output{font-size:11px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.ajuste select{width:100%;height:34px;padding:0 10px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:#242941;color:#eef0fa;font:inherit;font-size:12px;cursor:pointer;outline:none}
.ajuste select:focus-visible{border-color:#a5a9ff;box-shadow:0 0 0 2px rgba(165,169,255,.18)}
.ajuste select option{background:#171b2d;color:#eef0fa}
#reset{
  width:100%;margin-top:4px;background:rgba(255,255,255,.07);border:0;border-radius:8px;
  padding:8px;color:#c8cde0;font-size:11.5px;cursor:pointer;transition:background .2s ease;
}
#reset:hover{background:rgba(255,255,255,.13)}
.panel-nota{font-size:10px;line-height:1.4;color:#7b83a4;margin-top:10px;display:none}
.panel-nota.on{display:block}
</style>
</head>

<script>
(() => {
  'use strict';

  const D = window.PRESENTACION;
  const $ = (s, c = document) => c.querySelector(s);
  const stage = $('#stage');
  const deck = $('#deck');
  const inicio = $('#inicio');

  /* ---------- escalado del escenario ---------- */
  function encajar() {
    const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  window.addEventListener('resize', encajar);
  encajar();

  /* ---------- utilidades ---------- */
  const mmss = s => {
    const m = Math.floor(s / 60), r = Math.round(s % 60);
    return `${m}:${String(r).padStart(2, '0')}`;
  };
  const orden = Object.keys(D.alumnos);

  /* ---------- selector ---------- */
  function pintarSelector() {
    const cont = $('#personas');
    for (const clave of orden) {
      const a = D.alumnos[clave];
      const card = document.createElement('button');
      card.type = 'button';
      card.className = `persona p-${clave}`;
      card.innerHTML = `
        <span class="persona-barra"></span>
        <span class="persona-nombre">${a.nombre}</span>
        <span class="persona-grupo">${a.comision} · ${a.codigo}</span>
        <span class="persona-bloque">${a.bloque}</span>
        <span class="persona-dur">${mmss(a.total)}</span>`;
      card.addEventListener('click', () => arrancar(clave));
      cont.appendChild(card);
    }
  }

  /* ---------- ajustes de voz ---------- */
  const guardado = (() => {
    try { return JSON.parse(localStorage.getItem('tfi-voz') || '{}'); } catch { return {}; }
  })();
  let velocidad = Number(guardado.velocidad) || 1;
  let tono = Number(guardado.tono) || 0;

  const outVel = $('#outVel'), outTono = $('#outTono');
  const inVel = $('#vel'), inTono = $('#tono');
  function pintarAjustes() {
    outVel.textContent = velocidad.toFixed(2).replace('.', ',') + '×';
    outTono.textContent = tono === 0 ? 'Original' : (tono > 0 ? '+' : '') + tono + ' cents';
    inVel.value = String(velocidad); inTono.value = String(tono);
  }
  function guardarAjustes() {
    try { localStorage.setItem('tfi-voz', JSON.stringify({ velocidad, tono })); } catch {}
  }
  inVel.addEventListener('change', e => {
    velocidad = Number(e.target.value); if (motor) motor.velocidad(velocidad);
    pintarAjustes(); guardarAjustes();
  });
  inTono.addEventListener('change', e => {
    tono = Number(e.target.value); if (motor) motor.tono(tono);
    pintarAjustes(); guardarAjustes();
  });
  $('#reset').addEventListener('click', () => {
    velocidad = 1; tono = 0;
    if (motor) { motor.velocidad(1); motor.tono(0); }
    pintarAjustes(); guardarAjustes();
  });
  pintarAjustes();

  const panel = $('#panel');
  const engranaje = $('#engranaje');
  function alternarPanel(abrir) {
    const abierto = abrir ?? !panel.classList.contains('abierto');
    panel.classList.toggle('abierto', abierto);
    panel.setAttribute('aria-hidden', abierto ? 'false' : 'true');
  }
  engranaje.addEventListener('click', () => alternarPanel());
  engranaje.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alternarPanel(); }
  });

  /* ---------- audio ---------- */
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let ctx = null;
  const buffers = {};
  let motor = null;
  let reproduciendo = false;
  let pausado = false;
  let total = 0;
  let raf = 0;
  let deckActual = null;

  function decodificar(clave) {
    const b64 = window.AUDIO_B64 && window.AUDIO_B64[clave];
    if (!b64) return Promise.reject(new Error('sin audio embebido'));
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Promise((res, rej) => {
      ctx.decodeAudioData(bytes.buffer, res, rej);
    });
  }

  function motorWebAudio(buffer) {
    let src=null, offsetStart=0, rate=1, startTime=0, pausedAt=0, isPaused=true;
    function stopSource(){if(!src)return;const old=src;src=null;old.onended=null;try{old.stop()}catch{}try{old.disconnect()}catch{}}
    function clamp(p){return Math.max(0,Math.min(Number(p)||0,buffer.duration))}
    function create(offset){
      const node=ctx.createBufferSource();node.buffer=buffer;node.playbackRate.value=rate;
      node.detune.value=tono-1200*Math.log2(rate);node.connect(ctx.destination);
      offsetStart=offset;startTime=ctx.currentTime;src=node;
      node.onended=()=>{if(src===node&&!isPaused){src=null;pausedAt=buffer.duration}};
      node.start(0,offset);
    }
    function position(){return isPaused?pausedAt:(!src?buffer.duration:clamp(offsetStart+(ctx.currentTime-startTime)*rate))}
    function seek(p){const wasPaused=isPaused;stopSource();pausedAt=clamp(p);if(!wasPaused)create(pausedAt)}
    return {
      tipo:'webaudio',
      iniciar(offset=0){stopSource();pausedAt=clamp(offset);isPaused=false;create(pausedAt)},
      posicion:position,posicionar:seek,
      velocidad(v){const p=position();rate=v;if(!isPaused){stopSource();create(p)}},
      tono(c){if(src&&!isPaused)src.detune.setTargetAtTime(c-1200*Math.log2(rate),ctx.currentTime,.04)},
      detener(){if(isPaused)return;pausedAt=position();isPaused=true;stopSource()},
      reanudar(){if(!isPaused)return;if(pausedAt>=buffer.duration)pausedAt=0;isPaused=false;create(pausedAt)}
    };
  }

  async function motorElemento(clave) {
    const el = new Audio(`audio/${clave}.mp3`);
    el.preload = 'auto';
    el.preservesPitch = true;
    await new Promise((res, rej) => {
      el.addEventListener('loadedmetadata', res, { once: true });
      el.addEventListener('error', () => rej(new Error('no se pudo cargar el audio')), { once: true });
    });
    return {
      tipo: 'elemento',
      iniciar(offset) {
        el.currentTime = offset;
        el.playbackRate = velocidad;
        el.play().catch(() => {});
      },
      posicion() { return el.currentTime; },
      posicionar(p) { el.currentTime = Math.max(0, Math.min(p, el.duration || p)); },
      velocidad(v) { el.playbackRate = v; },
      tono() { /* no disponible */ },
      detener() { el.pause(); },
      reanudar() { el.play().catch(() => {}); }
    };
  }

  async function prepararMotor(clave) {
    try {
      if (!ctx) ctx = new AudioCtx();
      if (ctx.state === 'suspended') await ctx.resume();
      if (!buffers[clave]) buffers[clave] = await decodificar(clave);
      motor = motorWebAudio(buffers[clave]);
    } catch (e) {
      console.warn('Web Audio no disponible; se usa el elemento de audio.', e);
      motor = await motorElemento(clave);
      $('#notaTono').textContent = 'El ajuste de tono no está disponible en este navegador.';
      $('#notaTono').classList.add('on');
    }
  }

  /* ---------- deck ---------- */
  function setCaptura(slide, i, instantaneo) {
    if (slide.capActual === i) return;
    slide.capActual = i;
    const capturas = slide.escena.capturas;
    const cap = capturas[i];
    const capas = slide.el.querySelectorAll('.shot-body img');
    const anterior = slide.capa ?? 0;
    const siguiente = 1 - anterior;
    const img = capas[siguiente];

    if (instantaneo) img.style.transition = 'none';
    img.src = 'capturas/' + cap.archivo;
    img.alt = cap.epigrafe;
    img.classList.add('on');
    capas[anterior].classList.remove('on');
    if (instantaneo) requestAnimationFrame(() => { img.style.transition = ''; });

    slide.capa = siguiente;
    const capEl = slide.el.querySelector('.cap');
    capEl.textContent = cap.epigrafe;
    slide.el.querySelector('.counter').textContent = `${i + 1} / ${capturas.length}`;
    if (!instantaneo) {
      capEl.animate(
        [{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }],
        { duration: 320, easing: 'ease-out' }
      );
    }
  }

  function montarDeck(clave) {
    const a = D.alumnos[clave];
    deck.className = 'al-' + clave;
    deck.innerHTML = '';
    const slides = [];

    /* portada */
    const cover = document.createElement('section');
    cover.className = 'slide cover';
    cover.innerHTML = `
      <div class="topbar"><span>TFI · Bases de Datos I</span><span>${a.bloque}</span></div>
      <div class="cover-grid">
        <div class="cover-main">
          <div class="eyebrow">${a.comision} · ${a.codigo}</div>
          <h1>${a.nombre}</h1>
          <div class="cover-bloque">${a.bloque}</div>
          <div class="cover-pie">Sistema de Pedidos / Ventas Online</div>
        </div>
        <div class="agenda">
          <div class="agenda-titulo">Contenido del bloque</div>
          ${a.escenas.map((e, i) => `
            <div class="agenda-item"><span class="agenda-num">0${i + 1}</span><span>${e.titulo}</span></div>
          `).join('')}
        </div>
      </div>`;
    deck.appendChild(cover);
    slides.push({ el: cover, tipo: 'cover', start: 0 });

    /* escenas */
    a.escenas.forEach((e, i) => {
      const s = document.createElement('section');
      s.className = 'slide scene';
      s.innerHTML = `
        <div class="topbar"><span>TFI · Bases de Datos I</span><span>${a.bloque} · ${a.codigo}</span></div>
        <div class="scene-grid">
          <header class="scene-head">
            <div class="izq">
              <div class="kicker">${e.kicker}</div>
              <h1>${e.titulo}</h1>
            </div>
            <div class="scene-lado">
              <p class="sub">${e.subtitulo}</p>
              <div class="scene-index">${String(i + 1).padStart(2, '0')} <span>/ 0${a.escenas.length}</span></div>
            </div>
          </header>
          <figure class="shot">
            <div class="shot-head"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="shot-tag">evidencia</span></div>
            <div class="shot-body"><img alt=""><img alt=""></div>
            <figcaption class="shot-foot"><span class="cap"></span><span class="counter"></span></figcaption>
          </figure>
        </div>`;
      deck.appendChild(s);
      const slide = { el: s, tipo: 'scene', start: e.start, escena: e, capActual: -1, capa: 0 };
      slides.push(slide);
      e.capturas.forEach(c => { const im = new Image(); im.src = 'capturas/' + c.archivo; });
      setCaptura(slide, 0, true);
    });

    /* fin */
    const fin = document.createElement('section');
    fin.className = 'slide fin';
    fin.innerHTML = `
      <div class="fin-inner">
        <div class="fin-linea"></div>
        <div class="fin-titulo">Fin del bloque</div>
        <div class="fin-nombre">${a.nombre}</div>
        <div class="fin-grupo">${a.comision} · ${a.codigo}</div>
        <button class="fin-volver" type="button">Volver al inicio</button>
      </div>`;
    deck.appendChild(fin);
    slides.push({ el: fin, tipo: 'fin', start: Infinity });
    $('.fin-volver', fin).addEventListener('click', volver);

    deckActual = { clave, a, slides, idx: -1 };
  }

  function activar(i) {
    const d = deckActual;
    if (!d || i === d.idx) return;
    d.slides.forEach((s, j) => s.el.classList.toggle('active', j === i));
    d.idx = i;
  }

  function sincronizar(t) {
    const d = deckActual;
    if (!d) return;
    let idx = 0;
    for (let i = 0; i < d.slides.length; i++) {
      if (t >= d.slides[i].start) idx = i;
    }
    activar(idx);
    const s = d.slides[idx];
    if (s.tipo === 'scene') {
      let ci = 0;
      for (let i = 0; i < s.escena.partes.length; i++) {
        if (t >= s.escena.partes[i].start) ci = s.escena.partes[i].captura;
      }
      setCaptura(s, ci, false);
    }
  }

  /* ---------- reproducción ---------- */
  function bucle() {
    if (!reproduciendo || pausado || !motor) return;
    const t=motor.posicion(); if(t>=total-.04){finalizar();return}
    sincronizar(t); raf=requestAnimationFrame(bucle);
  }
  function alternarReproduccion(){
    if(!motor||!deckActual)return;
    if(reproduciendo){motor.detener();reproduciendo=false;pausado=true;cancelAnimationFrame(raf)}
    else if(pausado){motor.reanudar();pausado=false;reproduciendo=true;sincronizar(motor.posicion());raf=requestAnimationFrame(bucle)}
  }
  function buscar(delta){
    if(!motor||!deckActual)return;
    const p=Math.max(0,Math.min(total,motor.posicion()+delta));
    motor.posicionar(p);sincronizar(p);if(p>=total-.04&&reproduciendo)finalizar();
  }

  async function arrancar(clave) {
    if (reproduciendo) return;
    
    // Liberar motor y state anterior si existe
    if (deckActual) {
      deckActual = null;
      deck.innerHTML = '';
      inicio.classList.remove('oculto');
    }
    
    const a = D.alumnos[clave];
    total = a.total;
    montarDeck(clave);
    activar(0);
    inicio.classList.add('oculto');

    try {
      await prepararMotor(clave);
    } catch (e) {
      console.error(e);
      volver();
      return;
    }

    motor.velocidad(velocidad);
    motor.tono(tono);
    motor.iniciar(0);
    pausado = false;
    reproduciendo = true;
    sincronizar(0);
    raf = requestAnimationFrame(bucle);
  }

  function finalizar() {
    reproduciendo = false;
    pausado = false;
    cancelAnimationFrame(raf);
    if (motor) motor.detener();
    const d = deckActual;
    if (!d) return;
    
    // Mostrar diapositiva de fin
    d.slides.forEach(s => s.el.classList.toggle('active', s.tipo === 'fin'));
    d.idx = d.slides.length - 1;
    
    // Limpiar el deck después de mostrar el final para permitir reiniciar
    deckActual = null;
    setTimeout(() => {
      if (deck && deck.innerHTML && !deck.querySelector('.fin')) {
        deck.innerHTML = '';
        deck.className = '';
      }
    }, 100);
  }

  function volver() {
    reproduciendo = false;
    pausado = false;
    cancelAnimationFrame(raf);
    if (motor) { motor.detener(); motor = null; }
    deckActual = null;
    deck.innerHTML = '';
    deck.className = '';
    inicio.classList.remove('oculto');
  }

  document.addEventListener('keydown', e => {
    if(e.key==='Escape'){if(panel.classList.contains('abierto'))alternarPanel(false);else if(deckActual)volver();return}
    const t=e.target,typing=t&&(t.isContentEditable||['INPUT','SELECT','TEXTAREA','BUTTON'].includes(t.tagName));
    if(typing||!deckActual)return;
    if(e.key===' '){e.preventDefault();alternarReproduccion()}
    else if(e.key==='ArrowLeft'){buscar(-5);e.preventDefault()}
    else if(e.key==='ArrowRight'){buscar(5);e.preventDefault()}
  });
  document.addEventListener('pointerdown',e=>{
    if(panel.classList.contains('abierto')&&!panel.contains(e.target)&&!engranaje.contains(e.target))alternarPanel(false);
  });

  pintarSelector();

  /* Hook mínimo para verificación automatizada (no visible en la página). */
  window.TFI = {
    arrancar,
    volver,
    sincronizar,
    finalizar,
    estado: () => ({
      reproduciendo,
      pausado,
      t: motor ? motor.posicion() : 0,
      total,
      idx: deckActual ? deckActual.idx : -1,
      tipo: deckActual && deckActual.idx >= 0 ? deckActual.slides[deckActual.idx].tipo : null,
      motor: motor ? motor.tipo : null
    })
  };
})();
</script>
</body>
